<body data-page="404">
  <div class="ambient" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <header class="top" id="top">
    <div class="top-row">
      <a class="brand" href="/" aria-label="Matt, home">
        <img src="/assets/logo.png" alt="" width="34" height="34">
        <span>Matt</span>
      </a>
      <button class="menu-btn icon-btn" id="menu-btn" type="button" aria-expanded="false" aria-controls="top-nav" aria-label="Menu">
        <span class="bars"><span></span><span></span></span>
      </button>
      <nav class="top-nav" id="top-nav" aria-label="Main">
        <a class="nav-link" href="/work" data-nav="work">Work</a>
        <a class="nav-link" href="/about" data-nav="about">About</a>
        <a class="nav-link" href="/reviews" data-nav="reviews">Reviews</a>
        <a class="nav-link" href="/queue" data-nav="queue">Queue</a>
        <div class="top-side">
          <div class="top-user" id="top-user"><span class="sk" style="display:block;width:92px;height:36px;border-radius:11px"></span></div>
        </div>
      </nav>
    </div>
  </header>
  <main id="page" tabindex="-1">

    <section class="center-page lost" id="lost">
      <div class="lost-inner">
        <div class="lost-code" aria-hidden="true">
          <span class="lost-outline">404</span>
          <span class="lost-fill">404</span>
        </div>
        <h1 data-reveal style="--delay:120ms">This page wandered off.</h1>
        <p data-reveal style="--delay:220ms"><span class="mono lost-path" id="lost-path">/this-page</span> doesn't exist.</p>
        <div class="row" data-reveal style="--delay:320ms">
          <a class="btn" href="/">Back home</a>
          <a class="btn ghost" href="/work">See my work</a>
        </div>
      </div>
    </section>
  </main>

  <script>
    (function () {
      var el = document.getElementById('lost-path');
      var p = location.pathname;
      if (el && p && p !== '/404' && p !== '/404.html') el.textContent = p.length > 40 ? p.slice(0, 39) + '…' : p;
      // Spotlight: the gradient 404 shows through wherever the cursor is.
      var sec = document.getElementById('lost');
      if (!sec || matchMedia('(pointer: coarse)').matches) return;
      sec.addEventListener('pointermove', function (e) {
        var r = sec.querySelector('.lost-code').getBoundingClientRect();
        sec.style.setProperty('--mx', (e.clientX - r.left) + 'px');
        sec.style.setProperty('--my', (e.clientY - r.top) + 'px');
        sec.classList.add('lit');
      });
      sec.addEventListener('pointerleave', function () { sec.classList.remove('lit'); });
    })();
  </script>
  <script src="/js/core.js?v=7" defer></script>
